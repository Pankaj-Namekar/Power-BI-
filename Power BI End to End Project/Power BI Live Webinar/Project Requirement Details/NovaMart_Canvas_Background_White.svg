<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="NovaMart branded report canvas background, white, logo top right">
  <title>NovaMart — Power BI report canvas background (white)</title>
  <defs>
    <linearGradient id="wCoral" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8543A"/>
      <stop offset="1" stop-color="#FF8A6B"/>
    </linearGradient>
    <linearGradient id="wGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F5A400"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="wBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3C7C"/>
      <stop offset="1" stop-color="#161F45"/>
    </linearGradient>

    <g id="novaSparkW">
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wCoral)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wGold)" transform="rotate(60)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wCoral)" transform="rotate(120)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wGold)" transform="rotate(180)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wCoral)" transform="rotate(240)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wGold)" transform="rotate(300)"/>
      <circle r="9" fill="#FFFFFF"/>
    </g>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- logo lockup, tucked into the top-right corner -->
  <g transform="translate(1578,44)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#wBadge)"/>
    <g transform="translate(44,44) scale(0.62)"><use href="#novaSparkW"/></g>
    <g font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">
      <text x="104" y="46" font-size="34" fill="#1E2A5E">Nova<tspan fill="#FF6B4A">Mart</tspan></text>
      <text x="106" y="70" font-size="11" letter-spacing="4" fill="#5B6178">RETAIL INTELLIGENCE</text>
    </g>
  </g>
</svg>
