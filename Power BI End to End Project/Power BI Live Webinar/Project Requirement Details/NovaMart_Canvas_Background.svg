<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="NovaMart branded report canvas background">
  <title>NovaMart — Power BI report canvas background</title>
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2657"/>
      <stop offset="0.55" stop-color="#141B42"/>
      <stop offset="1" stop-color="#0B0F2A"/>
    </linearGradient>
    <linearGradient id="bgFooter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
    <linearGradient id="wmCoral" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8543A"/>
      <stop offset="1" stop-color="#FF8A6B"/>
    </linearGradient>
    <linearGradient id="wmGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F5A400"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3C7C"/>
      <stop offset="1" stop-color="#161F45"/>
    </linearGradient>

    <!-- reusable nova spark, unit size, tip length 52 -->
    <g id="novaSpark">
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wmCoral)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wmGold)" transform="rotate(60)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wmCoral)" transform="rotate(120)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wmGold)" transform="rotate(180)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wmCoral)" transform="rotate(240)"/>
      <path d="M 0,0 Q -19,-29 0,-52 Q 19,-29 0,0 Z" fill="url(#wmGold)" transform="rotate(300)"/>
      <circle r="9" fill="#FFFFFF"/>
    </g>

    <clipPath id="canvasClip"><rect x="0" y="0" width="1920" height="1080"/></clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- base wash -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#bgBase)"/>

    <!-- faint aisle / data-grid rules -->
    <g stroke="#FFFFFF" stroke-width="1" opacity="0.05">
      <line x1="120" y1="0" x2="120" y2="1080"/><line x1="240" y1="0" x2="240" y2="1080"/>
      <line x1="360" y1="0" x2="360" y2="1080"/><line x1="480" y1="0" x2="480" y2="1080"/>
      <line x1="600" y1="0" x2="600" y2="1080"/><line x1="720" y1="0" x2="720" y2="1080"/>
      <line x1="840" y1="0" x2="840" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/>
      <line x1="1080" y1="0" x2="1080" y2="1080"/><line x1="1200" y1="0" x2="1200" y2="1080"/>
      <line x1="1320" y1="0" x2="1320" y2="1080"/><line x1="1440" y1="0" x2="1440" y2="1080"/>
      <line x1="1560" y1="0" x2="1560" y2="1080"/><line x1="1680" y1="0" x2="1680" y2="1080"/>
      <line x1="1800" y1="0" x2="1800" y2="1080"/>
    </g>

    <!-- oversized watermark spark, bottom-right, bleeding off canvas -->
    <g transform="translate(1780,1040) rotate(18) scale(6.4)" opacity="0.10">
      <use href="#novaSpark"/>
    </g>
    <!-- smaller balancing spark, upper-right -->
    <g transform="translate(1660,180) rotate(-12) scale(2.6)" opacity="0.07">
      <use href="#novaSpark"/>
    </g>

    <!-- corner lockup: mark + light wordmark, top-left -->
    <g transform="translate(64,56)">
      <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#badgeGrad)"/>
      <g transform="translate(44,44) scale(0.62)"><use href="#novaSpark"/></g>
      <g font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">
        <text x="106" y="46" font-size="34" fill="#FFFFFF">Nova<tspan fill="#FF8A6B">Mart</tspan></text>
        <text x="108" y="70" font-size="11" letter-spacing="4" fill="#9AA3C4">RETAIL INTELLIGENCE</text>
      </g>
    </g>

    <!-- brand footer stripe -->
    <rect x="0" y="1076" width="1920" height="4" fill="url(#bgFooter)"/>
  </g>
</svg>
